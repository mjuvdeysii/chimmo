name: Chimmo
options:
  bundleIdPrefix: app.chimmo
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en]
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_NAME: "$(TARGET_NAME)"
    MARKETING_VERSION: "0.34.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Chimmo:
    type: application
    platform: iOS
    sources:
      - path: Chimmo
        excludes:
          - "Resources/Chimmo.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chimmo
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Chimmo/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Chimmo/Resources/Chimmo.entitlements
  ChimmoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChimmoTests
    dependencies:
      - target: Chimmo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chimmo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Chimmo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Chimmo:
    build:
      targets:
        Chimmo: all
        ChimmoTests: [test]
    test:
      targets:
        - ChimmoTests
