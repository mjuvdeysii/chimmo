<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>使用条款 · 咩哞 (Chimmo)</title>
  <style>
    :root {
      --bg: #F4EDE0;
      --paper: #FFFDF7;
      --shelf: #EFE4CF;
      --butter: #FFE49E;
      --mint: #D8F1E7;
      --outline: #231B15;
      --ink: #231B15;
      --sub: #5E5245;
      --accent: #0E766E;
      --shadow-hard: rgba(35, 27, 21, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E142C;
        --paper: #162048;
        --shelf: #1D2856;
        --butter: #2B2952;
        --mint: #162C46;
        --outline: #FFB94E;
        --ink: #F5ECDD;
        --sub: #B3BEDC;
        --accent: #53DFCF;
        --shadow-hard: rgba(4, 7, 20, 0.78);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 16px 40px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", sans-serif;
      line-height: 1.72;
    }
    .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
    .hero-banner {
      background: var(--paper);
      border: 2.5px solid var(--outline);
      border-radius: 24px;
      padding: 18px 22px;
      box-shadow: 0 5px 0 var(--shadow-hard);
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px 4px 6px;
      border-radius: 999px;
      background: var(--butter);
      color: var(--ink);
      border: 2px solid var(--outline);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 900; }
    .meta { margin: 4px 0 0; color: var(--sub); font-size: 13px; font-weight: 700; }
    .card {
      background: var(--paper);
      border: 2.2px solid var(--outline);
      border-radius: 20px;
      padding: 18px 22px;
      box-shadow: 0 4px 0 var(--shadow-hard);
    }
    h2 { margin: 0 0 8px; font-size: 17px; font-weight: 900; }
    p { margin: 0; font-size: 15px; font-weight: 500; }
    .back-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--shelf);
      border: 2.2px solid var(--outline);
      border-radius: 18px;
      padding: 12px 18px;
      box-shadow: 0 3px 0 var(--shadow-hard);
    }
    a.home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--butter);
      color: var(--ink);
      border: 2px solid var(--outline);
      box-shadow: 0 2px 0 var(--shadow-hard);
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
    }
    .nav-links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 800; }
    a { color: var(--accent); text-decoration: none; font-weight: 800; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero-banner">
      <span class="brand-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="6.5" cy="14" r="4.2" fill="#E64980" stroke="#231B15" stroke-width="1.6"/>
          <circle cx="17.5" cy="14" r="4.2" fill="#228BE6" stroke="#231B15" stroke-width="1.6"/>
          <rect x="8" y="6.5" width="8" height="12" rx="4" fill="#F25563" stroke="#231B15" stroke-width="1.7"/>
          <circle cx="12" cy="14" r="2.2" fill="#FFFDF7" stroke="#231B15" stroke-width="1.1"/>
        </svg>
        <span>CHIMMO TERMS OF USE</span>
      </span>
      <h1>咩哞（Chimmo）使用条款</h1>
      <p class="meta">生效日期：2026 年 11 月 21 日</p>
    </header>

    <section class="card">
      <h2>1. 创作归属</h2>
      <p>您使用咩哞（Chimmo）自行哼唱、点按或编排并导出的原创旋律与 MIDI 作品，其著作权完全归您本人所有。</p>
    </section>

    <section class="card">
      <h2>2. 应用与 IP 权利</h2>
      <p>应用内的「咩哞七小只（陶诺、豆叩、拍咯、呜嘟、壳咯、钵莫、叮尖）」角色造型、视觉设计、文案与原创代码受著作权保护。</p>
    </section>

    <section class="card">
      <h2>3. 免责声明</h2>
      <p>本应用按“现状”提供，完全在设备本地离线运行。开发者不对因设备硬件故障或系统升级导致的本地临时草图丢失承担赔偿责任。</p>
    </section>

    <footer class="back-bar">
      <a class="home-btn" href="index.html">返回咩哞主页</a>
      <nav class="nav-links" aria-label="法律与开源页面">
        <a href="privacy.html">隐私政策</a>
        <a href="licenses.html">开源许可</a>
        <a href="https://github.com/mjuvdeysii/chimmo">GitHub 仓库</a>
      </nav>
    </footer>
  </main>
</body>
</html>
